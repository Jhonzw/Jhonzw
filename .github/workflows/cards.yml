name: Atualizar cards do perfil

on:
  schedule:
    # todo dia às 09:00 UTC (06:00 em Goiânia)
    - cron: "0 9 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/render_cards.py"
      - ".github/workflows/cards.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar SVGs
        env:
          # CARDS_TOKEN (PAT com escopo read:user) mostra também as contribuições
          # em repositórios privados; sem ele cai no GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_cards.py

      - name: Commitar se mudou
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "nada mudou"
            exit 0
          fi
          git config user.name "Jhonzw"
          git config user.email "83783708+Jhonzw@users.noreply.github.com"
          git add assets
          git commit -m "chore: atualiza cards do perfil"
          git push
